<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FounderBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Jost:wght@300;500;700&family=Open+Sans:wght@400;700&family=Playfair+Display:wght@600;800&family=Poppins:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono&family=Syne:wght@600;800&family=Work+Sans:wght@400;600&display=swap">
    <style>
        :root {
            --bg: #050a17;
            --card: #0b1328;
            --tx: #f1f5ff;
            --mu: #8fa3c7;
            --br: #1b2a4f;
            color-scheme: dark;
            --pr: #2563eb;
            --pk: #60a5fa;
            --or: #0ea5e9;
            --tl: #38bdf8;
            --gr: #60a5fa;
            --sh: 0 6px 20px rgba(37, 99, 235, .10);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #050a17;
                --card: #0b1328;
                --tx: #f1f5ff;
                --mu: #8fa3c7;
                --br: #1b2a4f;
                --sh: none;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #050a17;
            --card: #0b1328;
            --tx: #f1f5ff;
            --mu: #8fa3c7;
            --br: #1b2a4f;
            --sh: none;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 20;
            background: var(--hdr, linear-gradient(100deg, #000, #0a1f5c 55%, #2563eb));
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            color: #fff
        }

        .logo {
            font-weight: 800;
            font-size: 19px
        }

        nav {
            display: flex;
            gap: 4px;
            flex: 1;
            overflow-x: auto
        }

        nav button {
            border: 0;
            background: none;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            color: #e9e2ff;
            font-weight: 600;
            white-space: nowrap
        }

        nav button.on {
            background: #fff;
            color: var(--pr)
        }

        .ic {
            border: 0;
            background: rgba(255, 255, 255, .2);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            position: relative
        }

        .dot {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--or);
            color: #fff;
            border-radius: 9px;
            font-size: 11px;
            padding: 0 5px
        }

        main {
            max-width: 1050px;
            margin: 0 auto;
            padding: 18px 16px 90px
        }

        .grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr))
        }

        .two {
            display: grid;
            gap: 16px;
            grid-template-columns: 2fr 1fr;
            align-items: start
        }

        @media(max-width:760px) {
            .two {
                grid-template-columns: 1fr
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--br);
            border-top: 4px solid var(--a, var(--pr));
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--sh)
        }

        h2 {
            margin: 0 0 10px;
            font-size: 21px
        }

        h3 {
            margin: 0 0 6px;
            font-size: 16px
        }

        .mu {
            color: var(--mu);
            font-size: 13px
        }

        .btn {
            border: 0;
            background: linear-gradient(90deg, var(--pr), var(--pk));
            color: var(--bx, #fff);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600
        }

        .btn.g {
            background: none;
            border: 1px solid var(--br);
            color: var(--tx)
        }

        .btn.s {
            padding: 5px 11px;
            font-size: 13px
        }

        .tag {
            display: inline-block;
            background: color-mix(in srgb, var(--a, var(--pr)) 15%, transparent);
            color: var(--a, var(--pr));
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 12px;
            margin: 2px 4px 2px 0;
            font-weight: 600
        }

        .av {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            flex: none
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap
        }

        .sp {
            justify-content: space-between
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 9px
        }

        .hero {
            border-radius: 16px;
            padding: 34px 22px;
            color: #fff;
            background: linear-gradient(120deg, var(--a), #60a5fa)
        }

        .hero h1 {
            margin: 0 0 4px;
            font-size: 30px
        }

        input,
        select,
        textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--br);
            border-radius: 10px;
            padding: 9px 11px
        }

        label {
            font-size: 13px;
            color: var(--mu);
            display: block;
            margin: 8px 0 3px
        }

        .sub {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 14px 0
        }

        .sub button {
            border: 1px solid var(--br);
            background: var(--card);
            border-radius: 20px;
            padding: 6px 14px;
            cursor: pointer
        }

        .sub button.on {
            background: var(--pr);
            color: #fff;
            border-color: var(--pr)
        }

        .bar {
            height: 9px;
            background: var(--br);
            border-radius: 8px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--gr), var(--tl))
        }

        .ph {
            aspect-ratio: 4/3;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--a), var(--pk));
            background-size: cover;
            background-position: center;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            text-align: center;
            padding: 6px
        }

        .pimg {
            width: 100%;
            max-height: 340px;
            object-fit: cover;
            border-radius: 12px
        }

        .fab {
            position: fixed;
            right: 18px;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 28px;
            background: linear-gradient(135deg, var(--pr), var(--pk));
            box-shadow: 0 6px 20px rgba(56, 189, 248, .45)
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(10, 8, 25, .6);
            display: none;
            place-items: center;
            z-index: 50;
            padding: 16px
        }

        .modal.on {
            display: grid
        }

        .modal .card {
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            overflow: auto
        }

        .pop {
            position: fixed;
            right: 16px;
            top: calc(60px + env(safe-area-inset-top, 0px));
            width: 320px;
            max-width: calc(100% - 32px);
            z-index: 30;
            display: none
        }

        .pop.on {
            display: block
        }

        .it {
            padding: 8px 0;
            border-bottom: 1px solid var(--br)
        }

        .it:last-child {
            border: 0
        }

        .done {
            text-decoration: line-through;
            color: var(--mu)
        }

        .stat {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        .stat div {
            flex: 1;
            min-width: 110px;
            border-radius: 14px;
            padding: 12px;
            color: #fff;
            font-weight: 700
        }

        .stat small {
            display: block;
            font-weight: 400;
            opacity: .9
        }

        body {
            background: radial-gradient(circle at 10% 0, #0b2a7a66 0, transparent 45%), radial-gradient(circle at 100% 15%, #1d4ed855 0, transparent 40%), var(--bg);
            background-attachment: fixed
        }

        .card {
            transition: transform .15s, box-shadow .15s
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(37, 99, 235, .18)
        }

        .hero h1 {
            text-shadow: 0 2px 10px rgba(0, 0, 0, .15)
        }

        a.btn {
            text-decoration: none;
            display: inline-block
        }

        .msg.err {
            background: #1e3a8a66;
            color: #bfdbfe;
            padding: 8px 12px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px
        }

        .stp {
            display: flex;
            gap: 6px;
            margin: 8px 0 4px
        }

        .stp i {
            flex: 1;
            height: 5px;
            border-radius: 5px;
            background: var(--br)
        }

        .stp i.on {
            background: linear-gradient(90deg, #2563eb, #38bdf8)
        }

        .opt {
            border: 1px solid var(--br);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            background: var(--bg);
            text-align: left;
            width: 100%;
            margin-top: 10px;
            color: var(--tx)
        }

        .opt:hover {
            border-color: #38bdf8
        }

        #splash {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 6px;
            background: radial-gradient(circle at 50% 40%, #0b2a7a, #000 70%);
            color: #fff;
            transition: opacity .6s
        }

        #splash.off {
            opacity: 0;
            pointer-events: none
        }

        #splash .lg {
            animation: pop 1s ease both
        }

        #splash h1 {
            font-size: 36px;
            margin: 6px 0 0;
            letter-spacing: 1px;
            animation: up .9s .4s both
        }

        #splash p {
            margin: 0;
            color: #9db8ff;
            animation: up .9s .8s both
        }

        .ld {
            width: 190px;
            height: 4px;
            background: #ffffff30;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 20px
        }

        .ld i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #fff);
            animation: ld 3.6s linear forwards
        }

        @keyframes pop {
            from {
                transform: scale(.5) rotate(-8deg);
                opacity: 0
            }

            to {
                transform: none;
                opacity: 1
            }
        }

        @keyframes up {
            from {
                transform: translateY(14px);
                opacity: 0
            }

            to {
                transform: none;
                opacity: 1
            }
        }

        @keyframes ld {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        .web {
            border-radius: 16px;
            overflow: clip;
            background: var(--bg);
            color: var(--fg)
        }

        .wn {
            position: sticky;
            top: calc(58px + env(safe-area-inset-top, 0px));
            z-index: 15;
            background: var(--bg);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 22px;
            border-bottom: 1px solid var(--bd)
        }

        .wn .lo {
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap
        }

        .wn .lk {
            display: flex;
            gap: 2px;
            flex: 1;
            justify-content: center;
            overflow: hidden
        }

        .web button.nb,
        .web .ddb {
            background: none;
            border: 0;
            color: var(--fg);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: .6px;
            text-transform: uppercase;
            padding: 8px 10px;
            cursor: pointer;
            white-space: nowrap
        }

        .web button.nb:hover,
        .web .ddb:hover {
            color: var(--ac2)
        }

        .dd {
            position: relative
        }

        .dd:after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            height: 14px
        }

        .ddp {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 10px);
            width: min(840px, 92vw);
            background: var(--bg);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 26px;
            grid-template-columns: repeat(3, 1fr) 1.3fr;
            gap: 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .7);
            z-index: 30
        }

        .dd:hover .ddp,
        .dd:focus-within .ddp {
            display: grid
        }

        .ddp h4 {
            font-size: 11px;
            letter-spacing: 1px;
            color: #8b8b95;
            margin: 0 0 10px;
            font-weight: 600
        }

        .ddp button {
            display: block;
            background: none;
            border: 0;
            color: var(--fg);
            font-size: 15px;
            text-align: left;
            padding: 6px 0;
            cursor: pointer
        }

        .ddp button:hover {
            color: var(--ac2)
        }

        .ddp .cd {
            background: var(--cd);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            font-size: 14px
        }

        .ddp .cd small {
            color: #8b8b95;
            display: block;
            margin-top: 2px
        }

        .wh {
            color: #fff;
            min-height: 540px;
            padding: 70px 28px 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-size: cover;
            background-position: center
        }

        .wh .ey {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #cfd8ff;
            margin-bottom: 14px
        }

        .wh h1 {
            font-size: clamp(38px, 7vw, 80px);
            line-height: 1.02;
            font-weight: 500;
            margin: 0 0 18px;
            max-width: 820px;
            letter-spacing: -1.5px
        }

        .wh p {
            font-size: 18px;
            max-width: 560px;
            margin: 0 0 26px;
            color: #e4e7f5
        }

        .wb {
            display: inline-block;
            background: var(--fg);
            color: var(--bg);
            border: 0;
            border-radius: 6px;
            padding: 14px 26px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            margin: 0 10px 10px 0
        }

        .wb.o {
            background: none;
            color: #fff;
            border: 1px solid #fff
        }

        .wb.k {
            background: var(--ltx);
            color: var(--lt)
        }

        .wb.s {
            padding: 10px 18px
        }

        .wst {
            display: flex;
            gap: 44px;
            flex-wrap: wrap;
            padding: 34px 0 30px
        }

        .wst b {
            display: block;
            font-size: 46px;
            font-weight: 400;
            letter-spacing: -1px;
            line-height: 1.1
        }

        .wst small {
            color: #d0d6ee;
            font-size: 13px
        }

        .ws {
            padding: 72px 28px;
            scroll-margin-top: 130px
        }

        .ws.l {
            background: var(--lt);
            color: var(--ltx)
        }

        .ws.d {
            background: var(--bg2)
        }

        .ws.l .mu {
            color: var(--mul)
        }

        .ws h2 {
            font-size: clamp(28px, 4.2vw, 48px);
            font-weight: 500;
            margin: 0 0 26px;
            letter-spacing: -.8px;
            line-height: 1.08
        }

        .wg {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr))
        }

        .wg2 {
            display: grid;
            gap: 40px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr))
        }

        .wt {
            border-radius: 14px;
            overflow: hidden;
            background: var(--cd)
        }

        .wt img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block
        }

        .wt .tx {
            padding: 16px
        }

        .wsv {
            border-top: 1px solid var(--bd);
            padding: 18px 0;
            font-size: 24px;
            display: flex;
            gap: 18px
        }

        .wsv i {
            color: var(--ac2);
            font-style: normal;
            font-size: 14px;
            padding-top: 9px
        }

        .wfa {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            border-bottom: 1px solid var(--lbd);
            padding: 10px 0;
            font-size: 15px
        }

        .wfa span {
            color: var(--mul)
        }

        .wph {
            aspect-ratio: 4/3;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--a), #000);
            background-size: cover;
            background-position: center;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 600;
            text-align: center;
            padding: 8px
        }

        .wfd {
            background: linear-gradient(120deg, var(--a), #000 85%)
        }

        .wrow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            border-top: 1px solid var(--lbd);
            padding: 20px 0
        }

        @media(max-width:820px) {
            .wn .lk {
                display: none
            }

            .wn {
                justify-content: space-between
            }

            .ddp {
                grid-template-columns: 1fr 1fr;
                width: min(92vw, 420px)
            }

            .ws {
                padding: 48px 18px
            }

            .wh {
                padding: 44px 18px 0
            }

            .wn {
                gap: 8px;
                padding: 10px 14px
            }

            .wn .lo {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                font-size: 12px;
                letter-spacing: 1px;
                flex: 1
            }

            .wn .wb.s {
                white-space: nowrap;
                padding: 9px 12px;
                font-size: 11px
            }

            .web .ddb {
                padding: 8px 6px;
                font-size: 12px
            }
        }

        .ph2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 560px;
            background: var(--bg)
        }

        .pt {
            position: relative;
            background: radial-gradient(circle at 30% 30%, var(--ac3), var(--bg) 70%);
            background-size: cover;
            background-position: center top;
            filter: grayscale(1) contrast(1.1)
        }

        .pt:after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 60%, var(--bg))
        }

        .pin {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 220px;
            font-weight: 700;
            color: var(--bd)
        }

        .pr {
            color: var(--fg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 40px 40px 10px
        }

        .hl1 {
            font-size: 44px;
            font-weight: 300
        }

        .hl2 {
            font-size: clamp(40px, 6vw, 68px);
            font-weight: 700;
            line-height: 1.1
        }

        .cur {
            display: inline-block;
            width: 2px;
            height: .9em;
            background: #fff;
            margin-left: 16px;
            vertical-align: middle;
            animation: bl 1s steps(2) infinite
        }

        @keyframes bl {
            50% {
                opacity: 0
            }
        }

        .rl {
            display: flex;
            gap: 26px;
            flex-wrap: wrap;
            margin: 26px 0;
            font-size: 13px;
            font-weight: 700
        }

        .so {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--bd);
            background: var(--bg2);
            color: var(--fg);
            display: inline-grid;
            place-items: center;
            margin: 0 10px 8px 0;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none
        }

        .so:hover {
            border-color: var(--ac)
        }

        .pf .lk {
            justify-content: flex-end
        }

        .pf .lo {
            gap: 0
        }

        .pf .lk .nb:first-child {
            color: var(--ac)
        }

        .ws.d .wfa {
            border-color: var(--bd)
        }

        .ws.d .wfa span {
            color: #9aa3bd
        }

        .cmp {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px
        }

        .cmp .it2 {
            flex: 0 0 250px;
            border-radius: 14px;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--br)
        }

        .cmp img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block
        }

        .cmp .ph0 {
            height: 110px;
            display: grid;
            place-items: center;
            font-size: 34px;
            background: linear-gradient(135deg, #1d4ed8, #000)
        }

        @media(max-width:820px) {
            .ph2 {
                grid-template-columns: 1fr
            }

            .pt {
                min-height: 340px
            }

            .pr {
                padding: 26px 20px
            }

            .hl1 {
                font-size: 32px
            }

                if (au.mode == "p3" && !d.head) return fail("Tell us who you are."); if (au.mode == "i3" && (!d.firm || !d.ticket || !d.sec)) return fail("Firm name, ticket size and sectors are required."); if (au.mode == "c3c" && (!d.role || !(d.fbio || "").trim())) return fail("Add your role and what you do in the company."); if (!d.photo) return fail("Please upload your profile photo.");
                const salt = crypto.randomUUID(), m = S.me; S.acct = { uid: d.uid, email: d.email, phone: d.phone, salt, hash: await hp(d.pw, salt) };
                Object.assign(m, { name: d.name, email: d.email, phone: d.phone, uid: d.uid, setup: 1, photo: d.photo, links: d.fli || "" });
                if (au.kind == "company") {
                    m.type = d.ckind == "Startup" ? "Startup founder" : "Company owner"; m.head = (d.role || "Founder & CEO") + " at " + d.cn; m.bio = d.fbio || "";
                    const team = [{ n: d.name, r: d.role || "Founder & CEO", bio: d.fbio, e: d.email, photo: d.photo }]; m.hub = d.hub == "No" ? 0 : 1; if (d.t2n) team.push({ n: d.t2n, r: d.t2r || "Team member" });
                    const c = S.company = { logo: d.logo, n: d.cn, tag: d.tag || "", about: d.what || "", svc: [], color: "#2563eb", site: d.site || "", email: d.cemail || d.email, phone: d.cphone || d.phone, addr: d.addr || "", pub: 0, ckind: d.ckind, ind: d.ind, yr: d.yr, rst: d.rst, udyam: d.udyam, cin: d.cin, gst: d.gst, dpiit: d.dpiit, vision: d.vis, mission: d.mis, jobs: [], resumes: [], team, photos: [], sent: [], projects: d.pt ? [{ t: d.pt, st: d.ps, d: d.pd, imgs: d.pimg ? [d.pimg] : [] }] : [] };
                    const tk = [+(c.rst == "Registered"), +!!c.udyam, +!!c.gst, +(c.dpiit == "Yes"), 0, +!!(c.vision && c.mission), 1, +!!(c.projects.length && c.projects[0].imgs.length)];
                    S.tasks = [["Create company page", 1], ["Add contact info", +!!(c.addr || c.phone)], ["Post your first job", 0], ["Upload 3 photos", 0], ["Connect with 5 people", 0], ["Post a daily update", 0], ["Join a meetup", 0], ["Publish your company site", 0]].concat(NT.map((t, i) => [t, tk[i]]))
                }
                else if (au.kind == "investor") { const L = x => (x || "").split(",").map(y => y.trim()).filter(Boolean); m.type = "Investor"; m.head = d.itype + " · " + d.firm; m.bio = d.thesis || ""; m.loc = d.loc || ""; m.inv = { firm: d.firm, type: d.itype, ticket: d.ticket || "", sec: L(d.sec), stg: L(d.stg), loc: d.loc || "", thesis: d.thesis || "", port: L(d.port), site: d.site || "" } }
                else { m.type = "Individual"; m.head = d.head; m.bio = d.bio || ""; m.loc = d.loc || ""; m.edu = d.edu || ""; m.int = d.int || ""; m.skills = (d.skills || "").split(",").map(x => x.trim()).filter(Boolean) }
                S.tab = "home"; d.pw = d.pw2 = ""; au.mode = "done"; return draw()
            }
        }
        function auth() {
            const a = $("#auth"); a.classList.toggle("on", !!S.gate); if (!S.gate) { AK = ""; return }
            const au = S.au, d = au.d, m = au.mode, k = [m, S.chk, au.err, au.msg, d.pimg ? 1 : 0, d.logo ? 1 : 0, d.photo ? 1 : 0, au.kind].join(); if (k == AK) return; AK = k;
            const v = n => esc(d[n] || ""), I = (n, l, t) => `<label>${l}</label><input name="${n}" type="${t || "text"}" value="${v(n)}">`, T = (n, l) => `<label>${l}</label><textarea name="${n}" rows="2">${v(n)}</textarea>`, Sl = (n, l, o) => `<label>${l}</label><select name="${n}">${o.map(x => `<option ${d[n] == x ? "selected" : ""}>${x}</option>`).join("")}</select>`;
            const N = au.kind == "company" ? 5 : 3, hd = (i, t, s) => `<h2>${t}</h2><div class="stp">${Array.from({ length: N }, (_, j) => `<i class="${j < i ? "on" : ""}"></i>`).join("")}</div><div class="mu">Step ${i} of ${N} · ${s}</div>`;
            const nav = (nx, l) => `<div class="row" style="margin-top:16px;flex-wrap:nowrap"><button class="btn g" data-a="au_back">← Back</button><button class="btn" style="flex:1" data-a="${nx}">${l}</button></div>`;
            const er = au.err ? `<div class="msg err">${esc(au.err)}</div>` : "", ms = au.msg ? `<div class="mu" style="color:#7dd3fc;margin-top:8px">${esc(au.msg)}</div>` : "", lk = (t, g) => `<a data-a="au_go" data-v="${g}" style="cursor:pointer;color:#7dd3fc">${t}</a>`;
            let h = "";
            if (S.chk) h = "<h2>Loading…</h2>";
            else if (m == "done") h = `<h2>🎉 Account created</h2><div class="mu">Your User ID is</div><div style="font-size:28px;font-weight:800;letter-spacing:1px;margin:6px 0;color:#7dd3fc">${esc(S.acct.uid)}</div><div class="mu">Log in with this ID (or your email) and your password. Please note it down.</div><div class="row" style="margin-top:18px"><button class="btn" style="flex:1" data-a="au_enter">Enter FounderBridge</button></div>`;
            else if (m == "login") h = `<h2>Welcome back 👋</h2><div class="mu">Log in to FounderBridge${UID ? "" : " (demo mode: nothing is saved)"}</div>${I("lid", "User ID or email")}${I("lpw", "Password", "password")}${er}${ms}<div class="row" style="margin-top:16px"><button class="btn" style="flex:1" data-a="au_login">Log in</button></div><p class="mu" style="text-align:center">${lk("Forgot password?", "reset")}</p><div class="mu" style="text-align:center;margin-top:14px">New to FounderBridge?</div><button class="btn g" style="width:100%;margin-top:8px" data-a="au_go" data-v="s1">Create new account</button>`;
            else if (m == "reset") h = `<h2>Reset password</h2><div class="mu">${UID ? "You are signed in with claude.ai, so you can set a new password." : "Resetting needs a saved account (sign in to claude.ai)."}</div>${I("np", "New password", "password")}${I("np2", "Confirm new password", "password")}${er}<div class="row" style="margin-top:16px"><button class="btn g" data-a="au_go" data-v="login">Cancel</button><button class="btn" style="flex:1" data-a="au_reset">Save</button></div>`;
            else if (m == "s1") h = hd(1, "Create your account", "Account details") + I("name", "Full name") + I("email", "Email", "email") + I("phone", "Contact number", "tel") + I("pw", "Password (8+ with letters and numbers)", "password") + I("pw2", "Confirm password", "password") + er + `<div class="row" style="margin-top:16px"><button class="btn" style="flex:1" data-a="au_next">Next →</button></div>` + `<p class="mu" style="text-align:center">${lk("Already have an account? Log in", "login")}</p>`;
            else if (m == "s2") h = hd(2, "Choose your profile", "Who is this for?") + `<div class="mu" style="margin-top:6px">Your User ID: <b style="color:#7dd3fc">${esc(d.uid || "")}</b> (created for you)</div>` + `<button class="opt" data-a="au_kind" data-v="personal"><b>👤 Personal profile</b><div class="mu">For individuals: tell people who you are and what you do.</div></button><button class="opt" data-a="au_kind" data-v="company"><b>🏢 Company profile</b><div class="mu">For startups and existing companies: company page, registrations, team and projects.</div></button><button class="opt" data-a="au_kind" data-v="investor"><b>💼 Investor profile</b><div class="mu">For angels, VCs and funds: set your ticket size, sectors and portfolio so startups can find you.</div></button><div class="row" style="margin-top:16px"><button class="btn g" data-a="au_back">← Back</button></div>`;
            else if (m == "p3") h = hd(3, "About you", "Personal profile") + PU("aphoto", "Profile photo *", d.photo) + I("head", "Who are you? (e.g. Final-year engineering student) *") + T("bio", "What do you do?") + I("loc", "City") + I("edu", "Education") + I("skills", "Skills (comma separated)") + I("int", "Interests") + er + nav("au_finish", "Finish ✓");
            else if (m == "i3") h = hd(3, "Investor details", "Investor profile") + PU("aphoto", "Profile photo *", d.photo) + I("firm", "Firm or investor name *") + Sl("itype", "Investor type", ["Angel investor", "Venture capital", "Family office", "Corporate / CVC", "Accelerator"]) + I("ticket", "Ticket size (e.g. ₹10L – ₹50L) *") + I("sec", "Sectors you invest in (comma separated) *") + I("stg", "Stages (e.g. Pre-seed, Seed)") + I("loc", "Location") + T("thesis", "Investment thesis: what you look for") + I("port", "Past investments / portfolio (comma separated)") + I("site", "Website or LinkedIn") + er + nav("au_finish", "Finish ✓");
            else if (m == "c3a") h = hd(3, "Company basics", "Company profile") + Sl("ckind", "Company type", ["Startup", "Existing company"]) + PU("alogo", "Company logo *", d.logo) + I("cn", "Company name *") + I("tag", "Tagline") + Sl("ind", "Industry", IND) + I("yr", "Year started") + T("what", "What does the company do? *") + Sl("rst", "Registration status", ["Not registered", "In process", "Registered"]) + I("udyam", "Udyam / MSME number") + I("cin", "CIN / MCA number") + I("gst", "GST number") + Sl("dpiit", "DPIIT Startup India recognition", ["No", "Applied", "Yes"]) + `<div class="mu" style="margin-top:8px">Startups get a launch checklist (registrations, MSME, GST, DPIIT…) and a daily checklist on Home.</div>` + er + nav("au_next", "Next →");
            else if (m == "c3b") h = hd(4, "Contact, vision & mission", "Company profile") + I("cphone", "Company phone *") + I("cemail", "Company email *", "email") + I("site", "Website") + T("addr", "Address *") + T("vis", "Vision") + T("mis", "Mission") + er + nav("au_next", "Next →");
            else if (m == "c3c") h = hd(5, "Team & projects", "Company profile") + PU("aphoto", "Your photo (used on your founder card) *", d.photo) + I("role", "Your role (e.g. Founder & CEO) *") + T("fbio", "What do you do in the company? *") + I("fli", "Your LinkedIn (https://…, optional)") + Sl("hub", "Join the Founders Hub?", ["Yes", "No"]) + I("t2n", "Another team member (optional)") + I("t2r", "Their role") + `<h3 style="margin-top:14px">Project</h3>` + I("pt", "Project name") + Sl("ps", "Status", ["Completed", "Ongoing"]) + T("pd", "Project details") + `<label>Project photo</label><input type="file" accept="image/*" id="apimg">${d.pimg ? `<img class="pimg" src="${d.pimg}" alt="" style="margin-top:8px">` : ""}` + er + nav("au_finish", "Finish ✓");
            $("#abox").innerHTML = h
        }
        setTimeout(() => { const x = $("#splash"); x.classList.add("off"); setTimeout(() => x.remove(), 700) }, 3600);
        draw(); initDB();
    </script>
</body>

</html>
