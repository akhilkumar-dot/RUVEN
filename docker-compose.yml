version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: founderbridge
      POSTGRES_USER: founderbridge
      POSTGRES_PASSWORD: founderbridge_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founderbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/founderbridge
      - SPRING_DATASOURCE_USERNAME=founderbridge
      - SPRING_DATASOURCE_PASSWORD=founderbridge_local
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - FB_STORAGE_ENDPOINT=http://minio:9000
      - FB_STORAGE_ACCESS_KEY=minioadmin
      - FB_STORAGE_SECRET_KEY=minioadmin123
      - FB_STORAGE_BUCKET=founderbridge
      - FB_MAIL_HOST=mailhog
      - FB_MAIL_PORT=1025
      - FB_FRONTEND_URL=http://localhost:3000
      - FB_JWT_SECRET=${FB_JWT_SECRET:-local-dev-secret-change-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
