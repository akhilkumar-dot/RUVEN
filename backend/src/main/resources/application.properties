# ── Server ──────────────────────────────────────────────────────
server.port=8080

# ── Supabase PostgreSQL (Postgres 17, ap-south-1) ───────────────
# Connection pooler (port 6543, transaction mode) for production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&user=postgres.lrvxxgjcdsmjntauuqpj&password=${SUPABASE_DB_PASSWORD:changeme}}
spring.datasource.username=${DB_USER:postgres.lrvxxgjcdsmjntauuqpj}
spring.datasource.password=${SUPABASE_DB_PASSWORD:changeme}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway — point to Supabase direct (port 5432) for migrations ─
spring.flyway.enabled=false
# (Migrations applied directly via Supabase MCP during setup)

# ── Redis (Upstash or Railway Redis) ────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# ── JWT ──────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:dev-secret-CHANGE-THIS-in-production-must-be-at-least-32-characters}
app.jwt.access-expiry-seconds=900
app.jwt.refresh-expiry-days=30

# ── Cookie ───────────────────────────────────────────────────────
app.cookie.domain=${COOKIE_DOMAIN:localhost}

# ── Storage (Supabase Storage via S3 compatible API) ────────────
app.storage.endpoint=${STORAGE_ENDPOINT:https://lrvxxgjcdsmjntauuqpj.supabase.co/storage/v1/s3}
app.storage.access-key=${STORAGE_ACCESS_KEY:changeme}
app.storage.secret-key=${STORAGE_SECRET_KEY:changeme}
app.storage.bucket=${STORAGE_BUCKET:founderbridge-media}
app.storage.region=${STORAGE_REGION:ap-south-1}

# ── Google OAuth2 ────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/v1/auth/oauth2/google/callback

# ── Rate Limiting ────────────────────────────────────────────────
app.rate-limit.auth.capacity=10
app.rate-limit.api.capacity=120

# ── CORS ────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.founderbridge=INFO
logging.level.org.springframework.security=WARN

# ── OpenAPI ─────────────────────────────────────────────────────
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
