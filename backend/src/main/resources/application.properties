# ── Server ──────────────────────────────────────────────────────
server.port=8080

# ── Database ────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/founderbridge}
spring.datasource.username=${DB_USER:fb}
spring.datasource.password=${DB_PASSWORD:fb_dev_pw}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Flyway ──────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ── Redis ───────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ── App config ──────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:dev-secret-CHANGE-THIS-in-production-must-be-32-chars}
app.jwt.access-expiry-seconds=900
app.jwt.refresh-expiry-days=30

app.cookie.domain=${COOKIE_DOMAIN:localhost}

app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
app.storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
app.storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}
app.storage.bucket=${STORAGE_BUCKET:founderbridge}
app.storage.region=${STORAGE_REGION:ap-south-1}

app.rate-limit.auth.capacity=10
app.rate-limit.api.capacity=120

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.founderbridge=INFO
logging.level.org.springframework.security=WARN

# ── OpenAPI ─────────────────────────────────────────────────────
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
