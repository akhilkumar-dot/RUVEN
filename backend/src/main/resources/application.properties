# FounderBridge — Application Properties

spring.application.name=founderbridge

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/founderbridge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:founderbridge}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:founderbridge_local}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA - NEVER use update in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# Mail
spring.mail.host=${FB_MAIL_HOST:localhost}
spring.mail.port=${FB_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Virtual threads (Java 21)
spring.threads.virtual.enabled=true

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# App config
app.jwt.secret=${FB_JWT_SECRET:local-dev-secret-must-be-at-least-32-characters}
app.jwt.access-expiry-seconds=${FB_JWT_ACCESS_EXPIRY_SECONDS:900}
app.jwt.refresh-expiry-days=${FB_JWT_REFRESH_EXPIRY_DAYS:30}
app.frontend-url=${FB_FRONTEND_URL:http://localhost:3000}
app.backend-url=${FB_BACKEND_URL:http://localhost:8080}
app.cookie.domain=${FB_COOKIE_DOMAIN:localhost}

# Storage
app.storage.endpoint=${FB_STORAGE_ENDPOINT:http://localhost:9000}
app.storage.access-key=${FB_STORAGE_ACCESS_KEY:minioadmin}
app.storage.secret-key=${FB_STORAGE_SECRET_KEY:minioadmin123}
app.storage.bucket=${FB_STORAGE_BUCKET:founderbridge}
app.storage.region=${FB_STORAGE_REGION:us-east-1}

# Email provider
app.email.from=${FB_EMAIL_FROM:noreply@founderbridge.local}
app.email.provider=${FB_EMAIL_PROVIDER:smtp}
app.email.resend.api-key=${FB_EMAIL_RESEND_API_KEY:}

# Razorpay
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.razorpay.pro-plan-id=${RAZORPAY_PRO_PLAN_ID:}

# Feature flags
app.features.oauth.twitter=${FF_OAUTH_TWITTER:false}
app.features.oauth.github=${FF_OAUTH_GITHUB:false}
app.features.web-push=${FF_WEB_PUSH:false}
app.features.realtime-codoc=${FF_REALTIME_CODOC:false}

# Billing
app.billing.pro-price-paise=19900
app.billing.gst-rate=0.18
app.billing.gst-inclusive=true

# Rate limits
app.rate-limit.login.capacity=5
app.rate-limit.login.refill-minutes=15
app.rate-limit.api.capacity=200
app.rate-limit.api.refill-seconds=60

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
