spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

app.jwt.secret=test-secret-that-is-at-least-32-characters-long
app.jwt.access-expiry-seconds=900
app.jwt.refresh-expiry-days=30
app.cookie.domain=localhost
app.storage.endpoint=http://localhost:9000
app.storage.access-key=test
app.storage.secret-key=test
app.storage.bucket=test-bucket
app.storage.region=ap-south-1
app.rate-limit.auth.capacity=100
app.rate-limit.api.capacity=1000

spring.data.redis.host=localhost
spring.data.redis.port=6379
