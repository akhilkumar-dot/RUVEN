<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E22"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>

    <!-- Blue Chain Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Silver Metallic Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="chainShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="none" stroke="#2C2C32" stroke-width="2"/>

  <!-- Left Chain Link (Blue) -->
  <g filter="url(#chainShadow)">
    <!-- Outer Blue Pill -->
    <rect x="98" y="126" width="230" height="260" rx="115" ry="115" fill="none" stroke="url(#blueGrad)" stroke-width="52"/>

    <!-- Left Person Silhouette inside left loop (White) -->
    <!-- Head -->
    <circle cx="175" cy="226" r="28" fill="#FFFFFF"/>
    <!-- Body / Shoulders -->
    <path d="M135 304 C135 268 152 260 175 260 C198 260 215 268 215 304 Z" fill="#FFFFFF"/>
  </g>

  <!-- Right Chain Link (Silver/Chrome) -->
  <g filter="url(#chainShadow)">
    <!-- Outer Silver Pill -->
    <rect x="208" y="126" width="206" height="260" rx="103" ry="103" fill="none" stroke="url(#silverGrad)" stroke-width="52"/>

    <!-- Right Person Silhouette inside right loop (Blue) -->
    <!-- Head -->
    <circle cx="339" cy="226" r="28" fill="url(#blueGrad)"/>
    <!-- Body / Shoulders -->
    <path d="M299 304 C299 268 316 260 339 260 C362 260 379 268 379 304 Z" fill="url(#blueGrad)"/>
  </g>

  <!-- Center Interlock: Re-draw front overlap segment of the Blue Link so it cleanly weaves through -->
  <path d="M 270 126 A 115 115 0 0 1 328 256" fill="none" stroke="url(#blueGrad)" stroke-width="52" stroke-linecap="round"/>
</svg>
